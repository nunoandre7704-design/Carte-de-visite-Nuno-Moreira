<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuno Da Silva Moreira — Carte de Visite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --dark: #0f172a;
      --dark-2: #1e293b;
      --light: #f8fafc;
      --gray: #64748b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1500px;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.3);
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
      50% { transform: translateY(-100px) translateX(50px); opacity: 0.8; }
    }

    /* Card container */
    .card-wrapper {
      width: 400px;
      height: 240px;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-wrapper.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* Front face */
    .card-front {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 35px;
      color: white;
    }

    .card-front::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .card-front::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .front-content {
      position: relative;
      z-index: 2;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .card-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-title {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.5;
    }

    .card-title strong {
      color: #fbbf24;
      font-weight: 600;
    }

    .flip-hint {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .flip-hint svg {
      width: 12px;
      height: 12px;
      animation: hintBounce 2s infinite;
    }

    @keyframes hintBounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    /* Back face */
    .card-back {
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 35px;
      color: white;
    }

    .card-back::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      border-radius: 50%;
    }

    .back-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .link-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      transform: translateX(4px);
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .link-btn.linkedin svg { color: #0a66c2; }
    .link-btn.cv svg { color: #f59e0b; }
    .link-btn.contact svg { color: #4ade80; }

    /* Bottom controls */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .control-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 30px;
      color: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      font-family: 'Inter', sans-serif;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
    }

    .control-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Top label */
    .top-label {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1px;
      z-index: 10;
      text-align: center;
    }

    .top-label span {
      color: #a5b4fc;
      font-weight: 600;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .card-wrapper {
        width: 320px;
        height: 200px;
      }
      .card-name { font-size: 22px; }
      .card-front { padding: 28px; }
      .card-back { padding: 24px 28px; }
      .link-btn { padding: 9px 14px; font-size: 12px; }
    }

    /* Entrance animation */
    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-wrapper {
      animation: cardEntrance 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tilt effect */
    .card-wrapper {
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
    }
  </style>
</head>
<body>

  <div class="top-label">Cliquez sur la carte pour la retourner ✨</div>

  <div class="particles" id="particles"></div>

  <div class="card-wrapper" id="card">

    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="front-content">
        <div class="card-badge">
          <span class="badge-dot"></span>
          Disponible pour une alternance
        </div>
        <h1 class="card-name">Nuno Da Silva Moreira</h1>
        <p class="card-title">
          Étudiant <strong>Bachelor 3ème année</strong><br>
          Sport · Commercial · Marketing · Événementiel
        </p>
      </div>
      <div class="flip-hint">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
        Retourner
      </div>
    </div>

    <!-- BACK -->
    <div class="card-face card-back">
      <div class="back-title">Mes coordonnées</div>
      <div class="links">
        <a href="https://www.linkedin.com/in/nuno-da-silva-moreira-821063270/" target="_blank" class="link-btn linkedin">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          LinkedIn
        </a>
        <a href="https://drive.google.com/file/d/1JsDsvWhu5sAWKEnX4z7Jv8fPqKZjYNGk/view?usp=sharing" target="_blank" class="link-btn cv">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Voir mon CV
        </a>
        <a href="#" id="contactBtn" class="link-btn contact">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Ajouter à mes contacts
        </a>
      </div>
    </div>

  </div>

  <div class="controls">
    <button class="control-btn" id="flipBtn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Retourner la carte
    </button>
    <button class="control-btn" id="shareBtn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
      Partager
    </button>
  </div>

  <script>
    // Particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 15 + 's';
      p.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particlesContainer.appendChild(p);
    }

    // Flip card
    const card = document.getElementById('card');
    const flipBtn = document.getElementById('flipBtn');

    function toggleFlip() {
      card.classList.toggle('flipped');
    }

    card.addEventListener('click', toggleFlip);
    flipBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFlip();
    });

    // 3D tilt effect (only on front, non-flipped)
    document.addEventListener('mousemove', (e) => {
      if (card.classList.contains('flipped')) return;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotateX = (-y / rect.height) * 12;
      const rotateY = (x / rect.width) * 12;
      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      if (!card.classList.contains('flipped')) {
        card.style.transform = '';
      }
    });

    // Share
    document.getElementById('shareBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const shareData = {
        title: 'Nuno Da Silva Moreira — Carte de visite',
        text: 'Découvrez la carte de visite interactive de Nuno Da Silva Moreira, étudiant en Bachelor 3 recherche une alternance (Sport / Commercial / Marketing / Événementiel).',
        url: window.location.href
      };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(window.location.href);
          const btn = e.currentTarget;
          const original = btn.innerHTML;
          btn.innerHTML = '✓ Lien copié !';
          setTimeout(() => { btn.innerHTML = original; }, 2000);
        }
      } catch (err) {}
    });

    // vCard download
    document.getElementById('contactBtn').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Nuno Da Silva Moreira
TITLE:Etudiant Bachelor 3eme annee - Recherche alternance
NOTE:Sport - Commercial - Marketing - Evenementiel
URL:https://www.linkedin.com/in/nuno-da-silva-moreira-821063270/
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nuno-da-silva-moreira.vcf';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
